name: Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_non_main:
        description: 'Deploying a non-main branch overwrites production. Type "deploy" to confirm.'
        required: false
        default: ''

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx cdk synth --quiet
        working-directory: infrastructure

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.outputs.outputs.api_url }}
      cognito_domain: ${{ steps.outputs.outputs.cognito_domain }}
      client_id: ${{ steps.outputs.outputs.client_id }}
    steps:
      - name: Guard against accidental non-main deploys
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.event.inputs.confirm_non_main != 'deploy'
        run: |
          echo "::error::Deploying branch '${{ github.ref_name }}' to production requires the confirm_non_main input set to 'deploy'."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy infrastructure
        run: npx cdk deploy HouseholdManager --require-approval never
        working-directory: infrastructure

      - name: Read stack outputs
        id: outputs
        run: |
          read_output() {
            aws cloudformation describe-stacks --stack-name HouseholdManager \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "api_url=$(read_output ApiUrl)"
            echo "cognito_domain=$(read_output CognitoDomain)"
            echo "client_id=$(read_output UserPoolClientId)"
            echo "web_bucket=$(read_output WebBucketName)"
            echo "distribution_id=$(read_output DistributionId)"
            echo "web_url=$(read_output WebUrl)"
            echo "google_secret_arn=$(read_output GoogleClientCredentialsSecretArn)"
            echo "firebase_secret_arn=$(read_output FirebaseServiceAccountSecretArn)"
          } >> "$GITHUB_OUTPUT"

      - name: Sync Google OAuth credentials
        # Only runs once the two repo secrets below are actually set — until
        # then this is a no-op, leaving the CDK-provisioned placeholder in
        # place (api/src/google/config.ts fails loudly and specifically if a
        # route tries to use it while it's still "REPLACE_ME"). Add
        # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings > Secrets
        # and variables > Actions to activate this — see
        # FEATURE_ANALYSIS.md's Phase 2 for where those two values come from
        # (a Google Cloud Console OAuth client, created by hand).
        # `secrets` isn't a readable context inside `if:` at all (only
        # "env", "github", "inputs", "job", "matrix", "needs", "runner",
        # "steps", "strategy", "vars" are) — routing it through this step's
        # own `env:` first is the standard workaround.
        if: ${{ env.GOOGLE_CLIENT_ID != '' && env.GOOGLE_CLIENT_SECRET != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ steps.outputs.outputs.google_secret_arn }}" \
            --secret-string "$(jq -n --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" '{clientId: $id, clientSecret: $secret}')"

      - name: Sync Firebase service account
        # The service account key JSON downloaded from Firebase, saved as the
        # FIREBASE_SERVICE_ACCOUNT repo secret. See README's "Phone notifications".
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ steps.outputs.outputs.firebase_secret_arn }}" \
            --secret-string "$FIREBASE_SERVICE_ACCOUNT"

      - name: Build SPA
        run: npm run build --workspace @hhm/app
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_domain }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.outputs.outputs.client_id }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY || secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID || secrets.FIREBASE_WEB_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || secrets.FIREBASE_MEASUREMENT_ID }}

      - name: Publish
        run: |
          # Hashed assets never change under the same name, so cache them
          # forever. index.html must always be revalidated: with no
          # Cache-Control at all, browsers guess a lifetime from its age,
          # and a kiosk that never reloads by hand kept running a weeks-old
          # build. The exact cp re-uploads it with that header even when
          # sync would skip it as unchanged.
          aws s3 sync app/dist "s3://${{ steps.outputs.outputs.web_bucket }}" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp app/dist/index.html "s3://${{ steps.outputs.outputs.web_bucket }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths '/*'

      - name: Summary
        run: echo "Deployed branch '${{ github.ref_name }}' to ${{ steps.outputs.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"

  # Pull requests: proves the Android app still builds. After a deploy: also
  # publishes an installable debug APK, pointed at the live API, as a run
  # artifact.
  android:
    needs: [verify, deploy]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ needs.deploy.outputs.api_url || 'https://api.invalid' }}
      VITE_COGNITO_DOMAIN: ${{ needs.deploy.outputs.cognito_domain || 'https://auth.invalid' }}
      VITE_USER_POOL_CLIENT_ID: ${{ needs.deploy.outputs.client_id || 'placeholder' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Add Firebase config
        # google-services.json from the Firebase console, saved as the
        # GOOGLE_SERVICES_JSON repo secret. Without it the APK builds with
        # phone notifications turned off.
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
      - run: npm run android:apk

      - if: needs.deploy.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: household-manager-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
