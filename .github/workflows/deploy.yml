name: Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_non_main:
        description: 'Deploying a non-main branch overwrites production. Type "deploy" to confirm.'
        required: false
        default: ''

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx cdk synth --quiet
        working-directory: infrastructure

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard against accidental non-main deploys
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.event.inputs.confirm_non_main != 'deploy'
        run: |
          echo "::error::Deploying branch '${{ github.ref_name }}' to production requires the confirm_non_main input set to 'deploy'."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy infrastructure
        run: npx cdk deploy HouseholdManager --require-approval never
        working-directory: infrastructure

      - name: Read stack outputs
        id: outputs
        run: |
          read_output() {
            aws cloudformation describe-stacks --stack-name HouseholdManager \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "api_url=$(read_output ApiUrl)"
            echo "cognito_domain=$(read_output CognitoDomain)"
            echo "client_id=$(read_output UserPoolClientId)"
            echo "web_bucket=$(read_output WebBucketName)"
            echo "distribution_id=$(read_output DistributionId)"
            echo "web_url=$(read_output WebUrl)"
            echo "google_secret_arn=$(read_output GoogleClientCredentialsSecretArn)"
          } >> "$GITHUB_OUTPUT"

      - name: Sync Google OAuth credentials
        # Only runs once the two repo secrets below are actually set — until
        # then this is a no-op, leaving the CDK-provisioned placeholder in
        # place (api/src/google/config.ts fails loudly and specifically if a
        # route tries to use it while it's still "REPLACE_ME"). Add
        # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET under Settings > Secrets
        # and variables > Actions to activate this — see
        # FEATURE_ANALYSIS.md's Phase 2 for where those two values come from
        # (a Google Cloud Console OAuth client, created by hand).
        if: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ steps.outputs.outputs.google_secret_arn }}" \
            --secret-string "$(jq -n --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" '{clientId: $id, clientSecret: $secret}')"

      - name: Build SPA
        run: npm run build --workspace @hhm/app
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_COGNITO_DOMAIN: ${{ steps.outputs.outputs.cognito_domain }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.outputs.outputs.client_id }}

      - name: Publish
        run: |
          aws s3 sync app/dist "s3://${{ steps.outputs.outputs.web_bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths '/*'

      - name: Summary
        run: echo "Deployed branch '${{ github.ref_name }}' to ${{ steps.outputs.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
